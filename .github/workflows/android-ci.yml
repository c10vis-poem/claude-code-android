name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ "NeuroOmni/**", ".github/workflows/android-ci.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "NeuroOmni/**", ".github/workflows/android-ci.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Compose BOM 2024.12.01 pulls Compose 1.7.6 / Material3 1.3.1, which
      # require the app to compile against SDK 35. Install the platform and
      # build-tools explicitly so checkDebugAarMetadata doesn't fall back to 34.
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Install Gradle directly — wrapper jar is not committed to the repo.
      # CI uses `gradle` command; `./gradlew` is for local use after running
      # `gradle wrapper --gradle-version 8.11.1` manually.
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > NeuroOmni/local.properties

      - name: Build debug APK
        working-directory: NeuroOmni
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      - name: Show Kotlin errors on failure
        if: failure()
        run: |
          mapfile -t elines < <(grep "^e: " /tmp/build.log | head -40)
          if [ ${#elines[@]} -gt 0 ]; then
            for line in "${elines[@]}"; do echo "::error::$line"; done
          else
            echo "::error::No 'e:' lines — dumping last 80 build log lines"
            tail -80 /tmp/build.log | while IFS= read -r l; do echo "::error::$l"; done
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: horizons-debug
          path: NeuroOmni/app/build/outputs/apk/debug/*.apk
          retention-days: 14
