name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ "NeuroOmni/**" ]
  pull_request:
    branches: [ main ]
    paths: [ "NeuroOmni/**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Install Gradle directly — wrapper jar is not committed to the repo.
      # CI uses `gradle` command; `./gradlew` is for local use after running
      # `gradle wrapper --gradle-version 8.11.1` manually.
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: NeuroOmni
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: horizons-debug
          path: NeuroOmni/app/build/outputs/apk/debug/*.apk
          retention-days: 14
