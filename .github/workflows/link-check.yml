name: Link Check

on:
  push:
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --accept 429
            --exclude anthropic.com
            --exclude f-droid.org
            --exclude play.google.com
            --exclude issuetracker.google.com
            "**/*.md"
          fail: true
